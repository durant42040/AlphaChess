[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[[bench]]
name = "perft"
harness = false

[[bench]]
name = "move_generation"
harness = false

[[bench]]
name = "micro_benchmarks"
harness = false

[[bench]]
name = "best_move"
harness = false

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[dependencies]
arrayvec = "0.7.6"
rand = "0.9.2"
rayon = "1.11"
stockfish = "0.2"
shakmaty = "0.30"

[profile.release]
# Maximize runtime performance at the cost of compile times and backtraces.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = false
overflow-checks = false
strip = "symbols"