[alias]
play = "run --manifest-path Cargo.toml --bin play --release"
stockfish = "run --manifest-path Cargo.toml --bin play_stockfish --release"
analyze = "run --manifest-path Cargo.toml --bin analyze --release"
fmte = "fmt --manifest-path engine/Cargo.toml"
fmts = "fmt --manifest-path server/Cargo.toml"

