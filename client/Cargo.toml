[package]
name = "client-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
gloo = "0.11"
gloo-events = "0.2"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlAudioElement", "Document", "Window", "Element", "DragEvent", "DataTransfer", "KeyboardEvent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4.58"
wasm-logger = "0.2.0"
log = "0.4.29"
